<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedran & Nurdan</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f1113;
font-family:'Montserrat',sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.card{
width:100%;
max-width:750px;
background:#181b1f;
border-radius:30px;
padding:40px 30px;
box-shadow:0 20px 70px rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.08);
}

.names{
font-family:'Cormorant Garamond',serif;
font-size:64px;
text-align:center;
color:#e3c88f;
margin-bottom:10px;
}

.year{
text-align:center;
letter-spacing:5px;
font-size:12px;
color:#888;
margin-bottom:25px;
}

.desc{
text-align:center;
line-height:1.8;
color:#cfcfcf;
margin-bottom:30px;
}

.event{
background:#22262b;
padding:18px;
border-radius:16px;
margin-bottom:12px;
}

.event-title{
color:#e3c88f;
font-weight:600;
margin-bottom:5px;
}

.upload-box{
margin-top:25px;
padding-top:25px;
border-top:1px solid rgba(255,255,255,.08);
}

select,
input[type=file]{
width:100%;
padding:15px;
background:#22262b;
border:1px solid #333;
border-radius:12px;
color:white;
margin-bottom:15px;
}

button{
width:100%;
padding:16px;
background:#e3c88f;
color:#111;
border:none;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

#status{
margin-top:15px;
text-align:center;
}

.footer{
margin-top:25px;
text-align:center;
font-size:13px;
color:#888;
}
</style></head><body><div class="card"><div class="names">Bedran & Nurdan</div><div class="year">2026</div><div class="desc">
Mutlu günümüzde çektiğiniz fotoğraf ve videoları bizimle paylaşabilirsiniz.
</div><div class="event">
<div class="event-title">💍 Nişan</div>
26 Temmuz 2026
</div><div class="event">
<div class="event-title">🤍 Diyarbakır Düğünü</div>
24 Ağustos 2026
</div><div class="event">
<div class="event-title">✨ İstanbul Düğünü</div>
30 Ağustos 2026
</div><div class="upload-box"><select id="eventSelect">
<option value="nisan">Nişan</option>
<option value="diyarbakir">Diyarbakır Düğünü</option>
<option value="istanbul">İstanbul Düğünü</option>
</select><input type="file" id="fileInput" accept="image/*,video/*"><button onclick="uploadFile()">
Fotoğraf / Video Yükle
</button><div id="status"></div></div><div class="footer">
Paylaşılan içerikler yalnızca gelin ve damat tarafından görüntülenebilir ❤️
</div></div><script>

const { createClient } = window.supabase;

const client = createClient(
'https://vbdtzrgzxbfnipbqdzrt.supabase.co',
'sb_publishable_kHAV2_4Y2lEWzBzPuDL0Cg_w_EuAOzk'
);

async function uploadFile(){

const file =
document.getElementById('fileInput').files[0];

if(!file){
alert('Lütfen dosya seçin');
return;
}

const folder =
document.getElementById('eventSelect').value;

document.getElementById('status').innerHTML =
'Yükleniyor...';

const fileName =
folder + '/' + Date.now() + '_' + file.name;

const { error } =
await client.storage
.from('Wedding media')
.upload(fileName,file);

if(error){

document.getElementById('status').innerHTML =
'❌ ' + error.message;

return;
}

document.getElementById('status').innerHTML =
'✅ Yükleme başarılı. Teşekkür ederiz ❤️';

}

</script></body>
</html>
