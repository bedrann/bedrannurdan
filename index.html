<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bedran & Nurdan</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111315;
font-family:'Montserrat',sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
color:white;
}

.card{
width:100%;
max-width:750px;
background:#1a1d20;
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
padding:50px 35px;
text-align:center;
box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.names{
font-family:'Cormorant Garamond',serif;
font-size:68px;
font-weight:600;
color:#e4c78d;
margin-bottom:10px;
}

.date{
letter-spacing:4px;
font-size:12px;
color:#888;
text-transform:uppercase;
margin-bottom:35px;
}

.desc{
max-width:500px;
margin:auto;
line-height:1.9;
color:#cfcfcf;
margin-bottom:40px;
}

.event{
padding:22px;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
margin-bottom:15px;
transition:.3s;
}

.event:hover{
border-color:#e4c78d;
transform:translateY(-2px);
}

.event-title{
font-size:20px;
font-weight:500;
margin-bottom:8px;
color:#e4c78d;
}

.event-date{
color:#bdbdbd;
}

.button{
display:inline-block;
margin-top:25px;
padding:18px 38px;
border-radius:14px;
background:#e4c78d;
color:#111315;
text-decoration:none;
font-weight:600;
font-size:15px;
}

.footer{
margin-top:30px;
font-size:13px;
color:#8d8d8d;
}

</style></head>
<body><div class="card"><div class="names">
Bedran & Nurdan
</div><div class="date">
2026
</div><div class="desc">
Bu özel günlerde çektiğiniz fotoğraf ve videoları bizimle paylaşabilirsiniz.
</div><div class="event">
<div class="event-title">Nişan</div>
<div class="event-date">26 Temmuz 2026</div>
</div><div class="event">
<div class="event-title">Diyarbakır Düğünü</div>
<div class="event-date">24 Ağustos 2026</div>
</div><div class="event">
<div class="event-title">İstanbul Düğünü</div>
<div class="event-date">30 Ağustos 2026</div>
</div><a href="#" class="button">
Fotoğraf ve Video Yükle
</a><div class="footer">
Paylaşılan içerikler yalnızca gelin ve damat tarafından görüntülenebilir.
</div></div></body>
</html>
